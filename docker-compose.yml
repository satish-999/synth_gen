services:
  synthgen:
    build: .
    ports:
      - "3080:3080"
    env_file:
      - server/.env.production
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      PUBLIC_URL: "http://localhost:3080"
    volumes:
      - synthgen-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  synthgen-data:
